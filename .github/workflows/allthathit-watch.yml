# AllThatHit 코칭 서버와 집 PC 워커 감시.
#
# 예약만으로는 GitHub 가 하루 4~5번밖에 안 켜 줬다(9/27~10/2 실측 23회,
# 사이가 4~7시간). 한 번 켜지면 55분만 보니 하루의 80% 는 아무도 안 보고
# 있었다. 그래서 한 바퀴가 끝나면 다음 바퀴를 스스로 부른다. 예약은 사슬이
# 끊겼을 때 다시 잇는 용도로만 남긴다.
#
# 이상하면 실패로 끝나고 GitHub 가 저장소 주인에게 메일을 보낸다. 실패한
# 바퀴는 다음을 부르지 않는다 - 같은 고장으로 메일이 한 시간마다 오지 않게.
# 다음 예약이 다시 본다.
#
# 버셀에는 5분에 요청 1개(하루 288개) - 처음 설계한 숫자 그대로다. 동시에 두
# 바퀴가 돌지 않으므로(concurrency) 그보다 늘지 않는다.
name: allthathit-watch
on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
permissions:
  actions: write
concurrency:
  group: allthathit-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: watch for 55 minutes
        run: |
          fail=0
          for i in $(seq 1 11); do
            body=$(curl -s -m 20 https://allthatfishing-brain.vercel.app/healthz || true)
            seen=$(echo "$body" | grep -oE '"house_seen_s":[0-9]+' | grep -oE '[0-9]+' || echo 99999)
            if ! echo "$body" | grep -q '"ok":true'; then
              echo "::error::코칭 서버 응답 없음 ($(date -u +%H:%M) UTC)"; fail=1; break
            fi
            if [ "$seen" -gt 600 ]; then
              echo "::error::집 PC 워커가 ${seen}초째 안 보임 - PC 전원·로그인 확인"; fail=1; break
            fi
            echo "$(date -u +%H:%M) ok, house seen ${seen}s ago"
            [ "$i" -lt 11 ] && sleep 300
          done
          exit $fail
      - name: next lap
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run allthathit-watch.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
