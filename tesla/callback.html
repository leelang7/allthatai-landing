<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AllThatKey · Tesla 연결</title>
<style>
  body{margin:0;padding:40px 20px;font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#f5f7f9;color:#10161c}
  main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #d2d9e0;border-radius:6px;padding:28px}
  h1{font-size:20px;margin:0 0 6px}
  p{margin:0 0 14px;color:#4b5866}
  code{display:block;word-break:break-all;background:#f5f7f9;border:1px solid #e3e8ed;border-radius:4px;padding:12px;font:14px/1.5 Consolas,monospace;margin:0 0 12px}
  button{font:inherit;padding:10px 16px;border-radius:4px;border:1px solid #b4451f;background:#b4451f;color:#fff;cursor:pointer}
  .err{color:#9e2b25}
</style>
</head>
<body>
<main>
  <h1>Tesla 연결</h1>
  <div id="out"><p>확인 중…</p></div>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  if (q.get('error')) {
    out.innerHTML = '<p class="err">테슬라가 거절했습니다: <b>' + q.get('error') + '</b></p><p>' + (q.get('error_description')||'') + '</p>';
    return;
  }
  var code = q.get('code');
  if (!code) { out.innerHTML = '<p class="err">코드가 없습니다. 이 페이지는 테슬라 로그인 뒤에 열립니다.</p>'; return; }
  // On a phone the app should have taken this address itself. When Android has
  // not verified the link (store installs could not, until 2026-11-03), the
  // login ended here with a code to copy and no way back - so hand the same
  // address to the app by name: an intent naming the package needs no verification.
  if (/Android/i.test(navigator.userAgent)) {
    var back = 'intent://allthatai.kr/tesla/callback' + location.search +
      '#Intent;scheme=https;package=kr.allthatai.keyprobe;end';
    out.innerHTML = '<p>테슬라 로그인이 끝났습니다.</p>' +
      '<a id="go" href="' + back + '" style="display:block;text-align:center;padding:16px;border-radius:12px;background:#2f6fe4;color:#fff;font-weight:700;font-size:18px;text-decoration:none">AllThatKey로 돌아가기</a>' +
      '<p style="margin-top:14px;font-size:14px">안 열리면 위 버튼을 한 번 더 누르세요.</p>';
    setTimeout(function(){ location.href = back; }, 300);
    return;
  }
  // The app on the phone intercepts this address itself; this page only exists
  // so a person in a desktop browser can hand the code on by hand.
  out.innerHTML = '<p>승인됐습니다. 아래 코드를 복사해 전달하세요. 한 번만 쓸 수 있고 몇 분 뒤 만료됩니다.</p>'
    + '<code id="c"></code><button id="b">복사</button>';
  document.getElementById('c').textContent = code;
  document.getElementById('b').onclick = function(){
    navigator.clipboard.writeText(code).then(function(){ document.getElementById('b').textContent = '복사됨'; });
  };
})();
</script>
</body>
</html>
