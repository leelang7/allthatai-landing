<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AllThatKey 설치하기</title>
<meta name="description" content="테슬라 워치 키 AllThatKey. 폰과 워치에 설치하는 순서.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f141b">
<meta property="og:title" content="AllThatKey · 테슬라 워치 키 설치">
<meta property="og:description" content="테스터 참여 → 폰 앱 → 워치 앱 → 차에서 키 등록">
<meta property="og:image" content="https://allthatai.kr/allthatkey/icon.png">
<style>
  :root {
    --bg: #0f141b; --card: #161c24; --ink: #ffffff; --soft: #b6c0cc;
    --accent: #4f8dff; --accent-ink: #ffffff; --done: #3ec27a; --line: #26303b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(120% 60% at 50% 0%, #26313e 0%, var(--bg) 60%);
    color: var(--ink); min-height: 100vh;
    font: 18px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 460px; margin: 0 auto; padding: 32px 16px 48px; }
  .hero { text-align: center; margin-bottom: 22px; }
  .hero img { width: 88px; height: 88px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .hero h1 { margin: 14px 0 4px; font-size: 28px; letter-spacing: -.5px; }
  .hero p { margin: 0; color: var(--soft); font-size: 16px; }
  .step { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin: 0 0 14px; transition: opacity .2s; }
  .step.done { opacity: .55; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
         font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .step.done .num { background: var(--done); font-size: 0; }
  .step.done .num::after { content: "✓"; font-size: 19px; }
  .title { font-size: 20px; font-weight: 800; }
  .tip { color: var(--soft); font-size: 16px; margin: 10px 2px 0; }
  .tip b { color: var(--ink); }
  a.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 58px; border-radius: 14px;
          background: var(--accent); color: var(--accent-ink); font-size: 19px; font-weight: 800; text-decoration: none;
          box-shadow: 0 5px 0 #2f63c4; transition: transform .05s, box-shadow .05s; }
  a.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2f63c4; }
  .step.done a.btn { background: #2a3442; color: var(--soft); box-shadow: none; }
  ol { margin: 0; padding-left: 1.2em; color: var(--soft); font-size: 16px; }
  ol li { margin: 4px 0; }
  ol b { color: var(--ink); }
  .foot { text-align: center; color: var(--soft); font-size: 14px; margin-top: 22px; }
  .foot a { color: var(--soft); }
</style>
</head>
<body><main>

<div class="hero">
  <img src="/allthatkey/icon.png" alt="AllThatKey">
  <h1>AllThatKey</h1>
  <p>폰에서 이 순서대로 누르세요</p>
</div>

<div class="step" id="s1">
  <div class="head"><div class="num">1</div><div class="title">테스터 참여</div></div>
  <a class="btn" href="https://play.google.com/apps/internaltest/4701685450817448176" target="_blank" rel="noopener" data-step="1">테스터 되기</a>
  <p class="tip">열린 화면에서 <b>"테스터 되기"</b> 한 번 더</p>
</div>

<div class="step" id="s2">
  <div class="head"><div class="num">2</div><div class="title">폰에 설치</div></div>
  <a class="btn" href="https://play.google.com/store/apps/details?id=kr.allthatai.keyprobe" target="_blank" rel="noopener" data-step="2">폰 앱 설치</a>
  <p class="tip">이미 설치했으면 건너뛰세요.</p>
</div>

<div class="step" id="s3">
  <div class="head"><div class="num">3</div><div class="title">워치에 설치</div></div>
  <a class="btn" href="https://play.google.com/store/apps/details?id=kr.allthatai.keyprobe" target="_blank" rel="noopener" data-step="3">워치에 설치 ⌚</a>
  <p class="tip"><b>"설치"</b> 옆 ▼ → <b>내 워치</b><br>또는 워치 Play 스토어에서 <b>AllThatKey</b> 검색</p>
</div>

<div class="step" id="s4">
  <div class="head"><div class="num">4</div><div class="title">처음 설정</div></div>
  <p class="tip" style="margin-top:0">폰 앱: <b>테슬라 로그인 → 차 선택 → 원격 허용</b><br>차 안에서: 워치 <b>"키 등록"</b> → 키카드를 컵홀더 앞에</p>
</div>

<p class="foot"><a href="/allthatkey/guide.html">사용 설명서</a> · 문의 leescvsir@gmail.com</p>

</main>
<script>
  // 누른 단계는 초록 체크로. 돌아왔을 때 어디까지 했는지 바로 보이게.
  (function () {
    var key = "atk-beta-done";
    var done = [];
    try { done = JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) {}
    function paint() { done.forEach(function (n) { var el = document.getElementById("s" + n); if (el) el.classList.add("done"); }); }
    paint();
    document.querySelectorAll("a.btn[data-step]").forEach(function (a) {
      a.addEventListener("click", function () {
        var n = +a.getAttribute("data-step");
        if (done.indexOf(n) < 0) done.push(n);
        try { localStorage.setItem(key, JSON.stringify(done)); } catch (e) {}
        setTimeout(paint, 300);
      });
    });
  })();
</script>
</body>
</html>
